<style>
/* Layout: full-bleed pixel canvas; thumb controls pinned to the two lower corners */
:root{
  --ink:#f6eed9; --ink-dim:#c9c0a6; --night:#0e1811; --panel:rgba(20,16,11,.92);
  --edge:#e6c068; --edge-dark:#7a5a22;
  --b-sword:#f0c65a; --b-shield:#86bdf0; --b-roll:#93d67c; --b-target:#ef8270; --b-item:#e58ad0; --b-hook:#f0a050; --b-lamp:#ffb347;
  --ui:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
#app{position:fixed;inset:0;overflow:hidden;background:#0b0a08}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--ui);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--edge);outline-offset:3px}

#hud{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;pointer-events:none}
#hearts{display:flex;gap:2px;flex-wrap:wrap;max-width:200px}
#hearts img{width:27px;height:24px;image-rendering:pixelated}
#counts{display:flex;gap:14px;font:600 16px var(--ui);text-shadow:0 2px 0 #000,0 0 4px #000;font-variant-numeric:tabular-nums}
#counts span{display:flex;align-items:center;gap:5px}
#counts img{image-rendering:pixelated}
#place{position:absolute;left:50%;top:28%;transform:translateX(-50%);font:700 28px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#fff3cf;text-shadow:0 3px 0 #2a1d09,0 0 18px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap}
#boss{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(320px,40%);pointer-events:none;text-align:center}
#boss b{display:block;font:700 14px var(--ui);letter-spacing:.1em;text-transform:uppercase;text-shadow:0 2px 0 #000;margin-bottom:3px}
#boss .bar{height:10px;border:2px solid #1b1420;background:#3a2a2a;box-shadow:0 0 0 2px var(--edge-dark)}
#boss .fill{height:100%;background:linear-gradient(#ff8a6a,#d8453a);transition:width .2s}

#pause{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:10px;border:2px solid rgba(246,238,217,.5);background:rgba(20,16,11,.5);font:700 15px var(--ui);letter-spacing:2px}

#hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:56%;padding:7px 14px;border-radius:8px;background:var(--panel);border:2px solid var(--edge-dark);font:500 15px var(--ui);text-align:center;pointer-events:none}
#toast{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:rgba(20,16,11,.8);font:500 15px var(--ui);pointer-events:none;max-width:70%;text-align:center}

#stickzone{position:absolute;left:0;bottom:0;width:45%;height:80%;touch-action:none}
#stick{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(246,238,217,.35);background:rgba(20,16,11,.28);pointer-events:none;opacity:.45;transition:opacity .15s}
#stick.live{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(246,238,217,.55);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}

.btn{position:absolute;border-radius:50%;border:3px solid currentColor;background:rgba(20,16,11,.42);display:grid;place-items:center;touch-action:none;font:700 13px var(--ui);letter-spacing:.04em;text-transform:uppercase;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);padding:0}
.btn span{color:var(--ink);text-shadow:0 1px 0 #000;line-height:1.1;text-align:center}
.btn.on{background:rgba(246,238,217,.28);transform:scale(.93)}
.btn.lit{background:rgba(239,130,112,.35)}
#b-sword{color:var(--b-sword);width:86px;height:86px;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:15px}
#b-shield{color:var(--b-shield);width:62px;height:62px;right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#b-roll{color:var(--b-roll);width:62px;height:62px;right:calc(34px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))}
#b-target{color:var(--b-target);width:58px;height:58px;right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));font-size:12px}
#b-item{color:var(--b-item);width:54px;height:54px;right:calc(192px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:11px}
#b-hook{color:var(--b-hook);width:56px;height:56px;right:calc(194px + env(safe-area-inset-right,0px));bottom:calc(102px + env(safe-area-inset-bottom,0px));font-size:12px}
#b-lamp{color:var(--b-lamp);width:54px;height:54px;right:calc(186px + env(safe-area-inset-right,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));font-size:12px}
#app.desk .btn,#app.desk #stick{display:none!important}
#keyhelp{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:500 13px var(--ui);color:var(--ink-dim);background:rgba(20,16,11,.6);padding:4px 12px;border-radius:6px;pointer-events:none;width:max-content;max-width:94%;text-align:center;display:none;transition:opacity .8s}
#app.desk #keyhelp{display:block}
#keyhelp.gone{opacity:0}
#zoombtns{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(62px + env(safe-area-inset-right,0px));display:flex;gap:6px}
#zoombtns button{width:42px;height:42px;border-radius:10px;border:2px solid rgba(246,238,217,.5);background:rgba(20,16,11,.5);font:700 20px var(--ui);padding:0}
@media (min-height:700px) and (pointer:fine){#hud{transform:scale(1.5);transform-origin:top left}}

#dlg{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#dlg .box{width:min(660px,66%);min-height:78px;padding:12px 18px 14px;background:var(--panel);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 3px #120e09,0 6px 20px rgba(0,0,0,.5);position:relative}
#dlg-who{font:700 15px var(--ui);color:var(--edge);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase;min-height:4px}
#dlg-text{font:500 18px/1.35 var(--ui);min-height:48px}
#dlg-more{position:absolute;right:14px;bottom:8px;color:var(--edge);font-size:14px;animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#title{background:linear-gradient(180deg,rgba(8,14,9,.35),rgba(8,14,9,.82) 70%)}
#title .inner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
#title h1{margin:0;font:700 clamp(44px,11vh,88px)/1 var(--ui);letter-spacing:.12em;color:#fff3cf;text-shadow:0 4px 0 #6b4a17,0 8px 0 #2a1d09,0 0 30px rgba(240,198,90,.45)}
#title .sub{font:500 18px var(--ui);color:var(--ink-dim);letter-spacing:.08em}
#title .note{font:400 13px var(--ui);color:var(--ink-dim);opacity:.8;margin-top:8px}
#title .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta{margin-top:14px;padding:12px 30px;font:700 19px var(--ui);letter-spacing:.1em;text-transform:uppercase;background:#2b1f0d;border:3px solid var(--edge);border-radius:8px;box-shadow:0 4px 0 #120e09}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #120e09}
.card{background:var(--panel);border:3px solid var(--edge);border-radius:8px;box-shadow:0 0 0 3px #120e09;padding:16px 24px;max-width:560px;max-height:calc(100% - 20px);overflow:auto;text-align:center}
.card h2{margin:0 0 8px;font:700 24px var(--ui);color:#fff3cf;letter-spacing:.04em}
.card p{margin:0 0 6px;font:400 16px/1.4 var(--ui);color:var(--ink)}
.card .goal{text-align:left;background:rgba(0,0,0,.25);border-radius:6px;padding:8px 12px;margin:6px 0}
.card .goal div{font:400 15px/1.4 var(--ui)}
.card .goal div::before{content:"\25B8  ";color:var(--edge)}
.card .tokens{display:flex;gap:8px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.card .tokens span{font:600 13px var(--ui);padding:3px 9px;border-radius:12px;border:2px solid #4a3d2a;color:var(--ink-dim)}
.card .tokens span.got{border-color:var(--edge);color:#fff3cf;background:rgba(240,198,90,.18)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.card .row button{padding:9px 18px;font:600 16px var(--ui);background:#2b1f0d;border:2px solid var(--edge);border-radius:6px}
.card .row button:disabled{opacity:.45;cursor:default}
.card .keys{font-size:13px;color:var(--ink-dim);margin-top:10px;line-height:1.5}
.card canvas.map{display:block;width:100%;max-width:400px;margin:2px auto 0;border:3px solid #6b4a17;border-radius:4px;box-shadow:0 0 0 2px #120e09}

#rotate{display:none;position:absolute;inset:0;background:var(--night);z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#rotate .phone{width:46px;height:78px;border:4px solid var(--edge);border-radius:9px;animation:turn 2s ease-in-out infinite}
#rotate p{font:500 20px var(--ui);margin:0}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#rotate .phone,#dlg-more{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Game view"></canvas>
  <div id="hud" hidden>
    <div id="hearts"></div>
    <div id="counts"><span><img id="ic-coin" alt="" width="16" height="16"><b id="n-coin">0</b></span><span id="c2"><img id="ic-2" alt="" width="24" height="19"><b id="n-2">0</b></span></div>
  </div>
  <div id="place" hidden></div>
  <div id="boss" hidden><b id="boss-name">Iron Sentinel</b><div class="bar"><div class="fill" id="boss-fill"></div></div></div>

    <button class="btn" id="b-target" aria-label="Lock on"><span>Target</span></button>

    <div class="inner">
      <h1>DAWNBELL</h1>

      <div class="ctas"><button class="cta" id="continue" hidden>Continue</button><button class="cta" id="start">New game</button><button class="cta" id="skip4" style="background:#2a6a8a">Test: skip to chapter four</button></div>
      <div class="note">Hold your phone sideways, or play with a keyboard or controller &middot; progress saves on this device</div>

  </div>
  <div id="menu" class="screen" hidden>

      <h2 id="menu-h">Paused</h2>
      <div id="menu-body"></div>

  </div>
  <div id="rotate"><div class="phone"></div><p>Turn your phone sideways to play</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
let VH=216;const TS=16;
let VW=384,MW=52,MH=32;
function resize(){const w=innerWidth||800,h=innerHeight||450;VH=(h>=600&&w>=900&&matchMedia('(pointer:fine)').matches)?264:216;VW=Math.max(260,Math.min(560,Math.round(VH*w/h)));cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();

/* ================= helpers ================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;if(fn)fn(g,c);return c;}
function sil(c,col){return mk(c.width,c.height,g=>{g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);});}
function outlined(c,col){const s=sil(c,col||'#1b1420');return mk(c.width+2,c.height+2,g=>{g.drawImage(s,0,1);g.drawImage(s,2,1);g.drawImage(s,1,0);g.drawImage(s,1,2);g.drawImage(c,1,1);});}
function flipH(c){return mk(c.width,c.height,g=>{g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);});}
const R=(g,col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
function blob(g,col,cx,cy,rx,ry){g.fillStyle=col;for(let y=-ry;y<ry;y++){const yy=(y+.5)/ry;const w=Math.round(rx*Math.sqrt(Math.max(0,1-yy*yy)));if(w>0)g.fillRect(cx-w,cy+y,w*2,1);}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d);};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
/* art helpers: colour mixing, smooth noise and soft shadows */
function hex2(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255];}
function mix(a,b,t){const A=hex2(a),B=hex2(b);return'#'+((1<<24)+(Math.round(A[0]+(B[0]-A[0])*t)<<16)+(Math.round(A[1]+(B[1]-A[1])*t)<<8)+Math.round(A[2]+(B[2]-A[2])*t)).toString(16).slice(1);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),s=t=>t*t*(3-2*t),u=s(x-xi),v=s(y-yi);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const SHADOWS=new Map();
function shadowImg(w,a){a=a||.42;const k=w+'|'+a;let c=SHADOWS.get(k);if(c)return c;const h=Math.max(4,Math.round(w*.45));
  c=mk(w+2,h+2,g=>{g.translate((w+2)/2,(h+2)/2);g.scale(1,h/w);const gr=g.createRadialGradient(0,0,0,0,0,w/2);gr.addColorStop(0,`rgba(14,22,40,${a})`);gr.addColorStop(.6,`rgba(14,22,40,${a*.8})`);gr.addColorStop(1,'rgba(14,22,40,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,w/2,0,7);g.fill();});
  SHADOWS.set(k,c);return c;}

/* ================= people sprites ================= */
const PAL={
  wren:{tun:'#3fb04e',tunD:'#2a7a3a',tunL:'#72d266',hair:'#c8692a',hairD:'#7e3a16',hoodC:'#2f8a48',skin:'#f3c69b',skinD:'#d99e72',belt:'#6e4320',buck:'#f0c65a',hood:true},

  aldous:{tun:'#e8e2d0',tunD:'#bdb5a0',tunL:'#ffffff',hair:'#f2f2f2',hairD:'#cfcfcf',skin:'#efc19a',skinD:'#d09a72',belt:'#c9a24a',robe:true,beard:'#f2f2f2',bald:true},
  venn:{tun:'#9fb1c8',tunD:'#6c7d96',tunL:'#d0dbea',hair:'#1f1a1a',hairD:'#100c0c',skin:'#d9a77c',skinD:'#b8865c',belt:'#8a1f2a',buck:'#f0c65a',legs:'#5a6378'},
  tilda:{tun:'#e0b23a',tunD:'#b48a22',tunL:'#f4d47a',hair:'#7a4a2a',hairD:'#5a341c',skin:'#f3c69b',skinD:'#d99e72',belt:'#6e4320',robe:true},
  bram:{tun:'#5a8ac8',tunD:'#3f6699',tunL:'#86aee0',hair:'#3a2a1a',hairD:'#2a1d12',skin:'#e8b88a',skinD:'#c99068',belt:'#3a2a1a'},
  hilde:{tun:'#9a6a8a',tunD:'#704a64',tunL:'#c08aac',hair:'#d8b060',hairD:'#b08a40',skin:'#f3c69b',skinD:'#d99e72',belt:'#4a2a3a',robe:true},

function dungeonRoom(id,name,rows,o){const H=rows.length,W=rows[0].length,g=grid(W,H,T.STONE),torches=[],plates=new Set();
  const M={'#':T.IWALL,'.':T.STONE,'T':T.TORCH,'D':T.DOOR,'P':T.PIT,'o':T.POST,'C':T.CHEST,'X':T.CRYSTAL,'=':T.BARS,'L':T.LOCK,'B':T.BIGLOCK,'I':T.PILLAR,'b':T.BARREL,'c':T.CRATE,'k':T.BLOCK,'_':T.PLATE,'z':T.BRAZ,'Z':T.BRAZL,'v':T.VINE,'~':T.WATER};
  rows.forEach((row,y)=>{if(row.length!==W)console.warn('room row width',id,y,row.length);[...row].forEach((ch,x)=>{let t=M[ch];if(t===undefined)t=T.STONE;
    if(t===T.BARS&&((o.crystalFlag&&F[o.crystalFlag])||(o.barsFlag&&F[o.barsFlag])))t=T.DOOR;if(t===T.LOCK&&F[o.lockFlag])t=T.DOOR;if(t===T.BIGLOCK&&F[o.bigFlag])t=T.DOOR;
    if(t===T.VINE&&o.vineFlag&&F[o.vineFlag])t=(x===0||y===0||x===W-1||y===H-1)?T.DOOR:T.STONE;if(t===T.BRAZ&&o.brazFlag&&F[o.brazFlag])t=T.BRAZL;
    if(t===T.PLATE)plates.add(x+','+y);if(t===T.TORCH)torches.push([x,y]);g.set(x,y,t);});});
  if(o.barsFlag&&F[o.barsFlag]&&plates.size){for(let i=0;i<g.m.length;i++)if(g.m[i]===T.BLOCK)g.m[i]=T.STONE;for(const k of plates){const[x,y]=k.split(',').map(Number);g.set(x,y,T.BLOCK);}}
  const chests=o.chests||{};for(const k in chests){const c=chests[k],[x,y]=k.split(',').map(Number);g.set(x,y,(c.hidden&&!F[o.reveal||o.trap])?T.STONE:T.CHEST);}
  const r=Object.assign({id,name,w:W,h:H,g,indoor:true,dungeon:true,dg:'hd',keyFlag:'hd_keys',bigKey:'hd_bk',floor:T.STONE,wallC:'#555b6c',wallTop:'#15131b',stoneC:['#4c5262','#3c4150','#5c6374'],tint:'rgba(70,100,160,.12)',npcs:[],enemies:[],signs:{},torches,chests,plates},o);

function buildMarsh(){

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.min(x,y,W-1-x,H-1-y);let t=T.GRASS;if(d<2)t=T.TREE;else if(d===2&&r()<.6)t=T.TREE;else if(d===3&&r()<.2)t=T.TREE;else if(r()<.04)t=T.FLOWER;g.set(x,y,t);}
  for(const[cx,cy,rad]of[[6,4,2.5],[20,5,2],[58,30,2.6],[8,36,2],[26,32,1.6],[37,4,1.6]])for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(Math.hypot(x,y)<rad+r()*.5)g.set(cx+x,cy+y,T.TREE);
  /* the lake, the tower island, a stepping islet and the heart islet */
  for(let y=10;y<=34;y++)for(let x=30;x<=59;x++){const dx=(x-45)/12.5,dy=(y-22)/10.5;if(dx*dx+dy*dy<1)g.set(x,y,T.WATER);}
  for(let y=15;y<=27;y++)for(let x=43;x<=55;x++){const dx=(x-49)/4.6,dy=(y-21)/4.4;if(dx*dx+dy*dy<1)g.set(x,y,T.GRASS);}
  g.fill(38,20,40,22,T.GRASS);g.fill(50,30,51,31,T.GRASS);
  /* the stream feeding the lake from the north */
  g.fill(44,2,45,11,T.WATER);
  /* the moonlily pond */
  for(let y=26;y<=36;y++)for(let x=9;x<=23;x++){const dx=(x-16)/6.2,dy=(y-31)/4.2;if(dx*dx+dy*dy<1)g.set(x,y,T.WATER);}
  g.fill(15,30,17,32,T.GRASS);
  /* paths */
  const path=(x0,y0,x1,y1)=>{for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){const t=g.get(x,y);if(t===T.WATER)g.set(x,y,T.BRIDGE);else g.set(x,y,T.PATH);}};
  path(31,0,32,20);path(9,12,32,13);path(16,13,17,24);path(32,6,56,7);
  for(let y=19;y<=23;y++)for(let x=28;x<=32;x++)if(g.get(x,y)===T.TREE)g.set(x,y,T.GRASS);
  /* north-east nook behind gloomvines */
  g.fill(56,2,61,9,T.TREE);g.fill(57,4,60,7,T.GRASS);g.set(56,6,F.vine_m?T.GRASS:T.VINE);g.set(56,7,F.vine_m?T.GRASS:T.VINE);
  /* grapple posts */
  for(const[x,y]of[[39,21],[45,19],[32,23],[50,30],[48,25],[16,30],[14,26]])g.set(x,y,T.POST);
  /* buildings: Old Wick's stilt hut and the sunken tower */
  const blds=[{x:7,y:8,w:5,h:4,door:2,roof:'#c8a050',wall:'#9a7a52',kind:'hut'},{x:47,y:16,w:4,h:4,door:1,kind:'tower'}];
  for(const b of blds){g.fill(b.x,b.y,b.x+b.w-1,b.y+b.h-1,T.BLD);g.set(b.x+b.door,b.y+b.h-1,T.DOOR);b.spr=b.kind==='tower'?towerSprite(b):buildingSprite(b);}
  g.fill(8,12,10,12,T.PATH);
  /* reeds, lilies, bushes and rocks, kept off the paths and grapple lines */
  const nearWater=(x,y)=>{for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)if(g.get(x+ox,y+oy)===T.WATER)return true;return false;};
  const keep=(x,y)=>(y>=19&&y<=24&&x>=28&&x<=47)||(x>=12&&x<=20&&y>=23&&y<=33)||(x>=43&&x<=55&&y>=15&&y<=32)||(x>=26&&x<=34&&y<=3);
  for(let y=3;y<H-3;y++)for(let x=3;x<W-3;x++){const t=g.get(x,y);if(keep(x,y))continue;
    if(t===T.WATER&&hash(x*5,y*7)<.07&&!nearWater(x,y-2))g.set(x,y,T.LILY);
    else if((t===T.GRASS||t===T.FLOWER)&&nearWater(x,y)&&hash(x*3,y*11)<.4)g.set(x,y,T.REED);}
  for(let i=0;i<120;i++){const x=3+((r()*(W-6))|0),y=3+((r()*(H-6))|0),t=g.get(x,y);if((t===T.GRASS||t===T.FLOWER)&&!keep(x,y)){let np=false;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const u=g.get(x+ox,y+oy);if(u===T.PATH||u===T.BRIDGE||u===T.DOOR||u===T.BLD)np=true;}if(!np)g.set(x,y,i<70?T.BUSH:i<95?T.REED:T.ROCK);}}
  g.set(30,3,T.SIGN);g.set(34,20,T.SIGN);
  /* pickups */
  const pk=[];const CAPS=[['cap1',4,22],['cap2',59,5],['cap3',12,16],['cap4',27,36],['cap5',54,11]];
  for(const[id,x,y]of CAPS)if(!F[id]){const[sx,sy]=walkSpot(g,x,y);g.set(sx,sy,T.GRASS);pk.push({x:sx*TS+8,y:sy*TS+8,vx:0,vy:0,z:0,vz:0,type:'cap',flag:id,t:1});}
  if(!F.hp_m)pk.push({x:51*TS+8,y:31*TS+8,vx:0,vy:0,z:0,vz:0,type:'hp',flag:'hp_m',t:1});
  if(F.lily_q&&!F.lily&&!F.lily_done)pk.push({x:16*TS+8,y:32*TS+4,vx:0,vy:0,z:0,vz:0,type:'lily',t:1});
  /* creatures */
  const en=[];const put=(k,x,y,sk)=>{const[sx,sy]=walkSpot(g,x,y);const e=mkEnemy(k,sx,sy);if(sk)e.sk=sk;en.push(e);};
  put('frog',27,17);put('frog',36,9);put('frog',38,33);put('frog',21,22);put('frog',10,24);
  put('plant',35,15);put('plant',6,27);put('plant',52,9);put('plant',25,10);
  put('slime',12,19,'mslime');put('slime',28,29,'mslime');put('slime',46,36,'mslime');put('slime',40,8,'mslime');
  return{id:'marsh',name:'The Gloaming Fen',w:W,h:H,g,outdoor:true,gpal:GP.marsh,buildings:blds,npcs:[],enemies:en,pickups:pk,vineFlag:'vine_m',
    signs:{'30,3':[L('Sign','THE GLOAMING FEN. Mind the deep water. Lights over the bog lead travelers astray.')],'34,20':[L('Sign','MIREWATCH TOWER. Sunk in the year the great bell broke. The old Warden posts still stand.')]},
    exits:[{x0:30,y0:0,x1:33,y1:0,to:'town',tx:28,ty:34,face:'U'},{x0:9,y0:11,x1:9,y1:11,to:'hut',tx:5,ty:6,face:'U'},{x0:48,y0:19,x1:48,y1:19,to:'mw1',tx:9,ty:11,face:'U'}],
    onEnter(){if(!F.marsh_seen){F.marsh_seen=true;say([L('Pip','The Gloaming Fen... It\'s always sunset here, isn\'t it? Spooky.'),L('Pip','See that tower sinking into the lake? That must be Mirewatch.'),L('Pip','It\'s too far to swim. Maybe someone around here knows the way across.')]);}}};}

/* ================= chapter four: the Saltmarrow Coast ================= */
const COAST_SHORE=y=>47+Math.round(Math.sin(y*.23)*2+Math.sin(y*.61));
const COAST_SAND=y=>25+Math.round(Math.sin(y*.3+1)*2);
function sandSpot(g,x,y){const ok=(a,b)=>g.get(a,b)===T.SAND;if(ok(x,y))return[x,y];for(let r=1;r<6;r++)for(let oy=-r;oy<=r;oy++)for(let ox=-r;ox<=r;ox++)if(ok(x+ox,y+oy))return[x+ox,y+oy];return[x,y];}
function buildCoast(){
  const W=72,H=44,g=grid(W,H,T.GRASS),r=rng(91);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let t=T.GRASS;const south=H-5+Math.round(Math.sin(x*.37)*1.2);
    if(x>=COAST_SHORE(y)||y>=south)t=T.WATER;
    else if(x>=COAST_SAND(y)||y>=south-4)t=T.SAND;
    if(t===T.SAND&&y<2)t=T.CLIFF;
    if(t===T.GRASS){if(y<2||(x<2&&!(y>=19&&y<=22)))t=T.TREE;else if(y===2&&r()<.5)t=T.TREE;else if(x<6&&r()<.25)t=T.TREE;else if(r()<.05)t=T.TREE;else if(r()<.06)t=T.FLOWER;}
    g.set(x,y,t);}
  /* the road in from Brackenford */
  for(let x=0;x<28;x++)for(const y of[20,21])g.set(x,y,T.PATH);
  /* Port Gullhaven: plaza, harbor office, tavern, the fish stall and the royal crates */
  g.fill(26,10,41,17,T.COBBLE);g.fill(28,18,29,21,T.COBBLE);
  const xs31=COAST_SHORE(31);
  const blds=[{x:27,y:5,w:6,h:5,door:2,roof:'#3e6a8a',wall:'#e8e0cc'},{x:34,y:4,w:7,h:6,door:3,roof:'#8a3a3a',kind:'inn'},
    {x:19,y:10,w:4,h:4,door:1,roof:'#a8743c',wall:'#d8c8a0'},{x:12,y:14,w:5,h:4,door:2,roof:'#4a6a8a',wall:'#e4dccb'},
    {x:57,y:30,w:4,h:4,door:1,kind:'light'}];
  /* the lighthouse rock, its causeway and gate */
  for(let y=27;y<=39;y++)for(let x=53;x<=66;x++){const dx=(x-59.5)/5.2,dy=(y-33)/4.6;if(dx*dx+dy*dy<1)g.set(x,y,T.SAND);}
  for(let x=xs31;x<=55;x++)for(const y of[31,32])if(g.get(x,y)===T.WATER)g.set(x,y,T.BRIDGE);
  const gx=xs31-1;g.set(gx,31,F.gl_open?T.SAND:T.GATE);g.set(gx,32,F.gl_open?T.SAND:T.GATE);
  for(let x=gx-3;x<gx;x++)for(const y of[31,32])g.set(x,y,T.SAND);
  for(const[x,y]of[[54,29],[64,30],[63,36],[55,36],[60,38]])g.set(x,y,T.ROCK);
  /* the long pier */
  for(let x=42;x<=58;x++)for(const y of[13,14])g.set(x,y,g.get(x,y)===T.WATER?T.BRIDGE:T.COBBLE);
  g.fill(55,11,58,16,T.BRIDGE);for(let y=11;y<=16;y++)for(let x=55;x<=58;x++)if(g.get(x,y)!==T.BRIDGE)g.set(x,y,T.BRIDGE);
  /* a tiny islet only a swimmer could reach */
  g.fill(64,6,66,8,T.SAND);g.set(66,6,T.ROCK);
  for(const b of blds){g.fill(b.x,b.y,b.x+b.w-1,b.y+b.h-1,T.BLD);g.set(b.x+b.door,b.y+b.h-1,T.DOOR);b.spr=b.kind==='light'?towerSprite(b):buildingSprite(b);}
  g.fill(20,14,20,19,T.PATH);g.fill(14,18,14,19,T.PATH);
  for(const[x,y]of[[39,11],[40,11],[39,16],[40,16],[41,16]])g.set(x,y,T.CRATE);
  g.set(30,16,T.STALL);g.set(31,16,T.STALL);g.set(34,11,T.BOARD);
  g.set(3,18,T.SIGN);g.set(gx-1,30,T.SIGN);
  /* driftwood, rocks and shrubs */
  for(let i=0;i<70;i++){const x=3+((r()*(W-6))|0),y=3+((r()*(H-6))|0),t=g.get(x,y);let np=false;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const u=g.get(x+ox,y+oy);if(u!==T.GRASS&&u!==T.SAND&&u!==T.FLOWER&&u!==T.TREE)np=true;}
    if(np)continue;if(t===T.SAND&&!(y>=29&&y<=34&&x>gx-6))g.set(x,y,i%3?T.ROCK:T.STUMP);else if((t===T.GRASS||t===T.FLOWER)&&i%2)g.set(x,y,T.BUSH);}
  /* pickups: sea glass, the islet's heart piece */
  const pk=[];const GLASS=[['glass1',31,25],['glass2',44,7],['glass3',41,37],['glass4',28,34],['glass5',62,34]];
  for(const[id,x,y]of GLASS)if(!F[id]){const[sx,sy]=sandSpot(g,x,y);pk.push({x:sx*TS+8,y:sy*TS+8,vx:0,vy:0,z:0,vz:0,type:'glass',flag:id,t:1});}

function startBrine(){const b=mkEnemy('brine',11,6);enemies.push(b);S.fight=true;S.boss=b;$('boss-name').textContent='Brinemaw';$('boss').hidden=false;updateBossBar();

function brineDefeated(e){S.fight=false;$('boss').hidden=true;F.gl_done=true;shots=[];shake(4,.8);SFX.slam();if(S.shut){for(const i of S.shut)map[i]=T.DOOR;S.shut=null;}
  enemies.forEach(o=>{if(o!==e&&!o.dead){o.dead=true;burst(o.x,o.y-6,10,ecol(o),60,.4);}});
  const cx=clamp(e.x,3*TS,(MW-3)*TS),cy=clamp(e.y,4*TS,(MH-3)*TS);
  say([L('Pip','It\'s scuttling off into the sea! And look what it was guarding...')],()=>{
    pickups.push({x:cx-14,y:cy,vx:0,vy:0,z:0,vz:90,type:'shard',t:0},{x:cx+16,y:cy,vx:0,vy:0,z:0,vz:90,type:'hc',flag:'gl_hc',t:0});saveGame();});}
function shard4Cutscene(){say([L('','You got the fourth Dawnbell Shard. It sat at the heart of the great lamp, and every night it shone out over the sea.'),
  L('Pip','The first Wardens hid a shard inside a lighthouse! Right where every ship could see it, and nobody would guess.'),
  L('','The four shards chime together. You see the garden of white roses again. The girl in the silver circlet looks up, as if she can hear you.'),
  L('','Her hair is gold as wheat.'),L('Pip','Gold hair... Wren, Maddox said the girl they carried onto that ship had gold hair.'),
  L('Pip','And the green star fell into the sea right here, the same night we fell through the forest pool. You don\'t think...'),
  L('Morrow','Four shards. You do make this easy, little Warden.'),L('Morrow','The Gilded Swan sails for Highcrown at dawn. Do enjoy the view.'),
  L('Pip','Out there! A ship with no lamps, sliding out of the harbor. That has to be it.'),L('Pip','Wherever that ship is going, we\'re going too. But first, Captain Venn needs to hear about this.')],
  ()=>{saveGame();SFX.win();setTimeout(()=>openMenu('chapter4'),700);});}

function talkPell(n){if(F.gl_open)return[L('Pell','The gate\'s open. Please find my dad. He\'s tall, and he smells like lamp oil.')];
  return{lines:[L('Pell','Are you a real Warden? With a real sword?'),L('Pell','My dad keeps the Gullrock Light. He hasn\'t come home since the night the green star fell.'),
    L('Pell','The soldiers say he retired. Dad would never leave the light. And now it\'s gone dark, and nobody\'s allowed on the causeway.'),
    L('Pell','I took his spare key off the hook. I\'m too scared to go out there alone...'),L('Pell','Will you find him? Please?'),L('','Pell unlocks the causeway gate with a shaky hand.')],
    after(){F.gl_open=true;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(tileAt(x,y)===T.GATE){setT(x,y,T.SAND);repaint(x,y);burst(x*TS+8,y*TS+8,8,['#f0c65a','#ffffff'],50,.4);}SFX.gate();toast('New goal: cross the causeway to Gullrock Light',3);saveGame();}};}
function talkPellHome(){return F.shard4?[L('Pell','Dad says the lamp is lit again. You can see it from my window!')]:[L('Pell','You found him! You really, really found him!'),L('Pell','When I grow up, I\'m going to be a Warden too.')];}
function talkHobbCell(n){if(!F.gl_p3)return[L('Hobb','The bars! The golden plates on the floor work them. Push those blocks onto the plates!')];
  return{lines:[L('Hobb','A boy with a sword? And a... glowing bug?'),L('Pip','Sprite!'),L('Hobb','Bless you both. I\'m Hobb, keeper of the Gullrock Light. Did my Pell send you?'),
    L('Hobb','Weeks back, on the night the green star fell, I was up in the lamp room. I watched it come down in the sea past Gullrock.'),
    L('Hobb','And there was a royal boat already waiting under the cliffs, with no lamps lit. As if they knew exactly where it would fall.'),
    L('Hobb','They pulled something out of the water and rowed it to the Gilded Swan. I wrote it all in my logbook like a fool, and told old Maddox at the Salted Gull.'),
    L('Hobb','Next morning the Chancellor\'s men took my log and locked me in here with their bells. Then that great crab moved into my lamp room and the light went out.'),
    L('Hobb','The brutes hung the key to the cistern stair right outside my cell. Take it.'),
    L('Hobb','And Warden? The first keepers said a relic sleeps in the cistern. A charm that lets a body swim like a seal. You\'ll need it to reach the lamp.'),
    L('Hobb','I\'ll find my own way home. Go!')],
    after(){F.hobb_free=true;F.gl_keys=(F.gl_keys||0)+1;npcs=npcs.filter(m=>m!==n);burst(n.x,n.y-6,10,['#ffffff','#a6dbf3'],50,.4);gotItem('Small Key');}};}
function talkHobbHome(){if(!F.hobb_reward)return{lines:[L('Hobb','Home, and Pell safe. I owe you more than I can pay, Warden. But take this, for a start.'),L('','Hobb gives you 30 marks and refills your potions.'),
      L('Hobb','I\'ve kept that light for twenty years. Before me, the Wardens kept it. The King closed their Hall, and the very next week his men came asking about my lamp.'),
      L('Hobb','I never knew why. Now I think I do.')],after(){F.hobb_reward=true;marks+=30;potions=Math.max(potions,F.bag?5:3);updateHud(true);SFX.coin();saveGame();}};
  if(F.shard4)return[L('Hobb','The lamp\'s lit again, with plain oil this time. The sea doesn\'t know the difference.'),L('Hobb','Watch yourself in Highcrown, Warden. Whatever they fished out of my sea, they wanted it badly.')];
  return[L('Hobb','Go careful up in the lamp room. That crab didn\'t like me one bit.')];}
function talkCoralie(){const n=Math.min(5,F.glass||0);
  if(F.glass_done)return[L('Coralie','The tide brings everything back in the end, dearie. Everything.')];
  if(!F.glass_q)return{lines:[L('Coralie','Sea glass, dearie. The tide brings it in, smooth as boiled sweets. I\'ve collected it for sixty years.'),L('Coralie','My eyes aren\'t what they were. Find me five pieces along the beach, and I\'ll give you something special.')],after(){F.glass_q=true;toast('Side quest: find 5 pieces of sea glass for Coralie',2.8);saveGame();}};
  if(n<5)return[L('Coralie',`You've found ${n} of 5. Look along the sand, and out on the rocks by the light.`)];
  return{lines:[L('Coralie','Oh, they\'re lovely. Green as a wave, blue as a gull\'s egg. Here, I\'ve kept this tucked away for a hero.'),
    L('Coralie','Funny thing. Last spring the envoy\'s men paid every fisher a silver mark for each old bell we dragged up.'),
    L('Coralie','One bell came up cracked, and the crack glowed blue. They took that one away in a terrible hurry.'),
    L('Pip','Glowed blue... like a shard! Wren, the King might already have one of his own.')],after(){F.glass_done=true;F.hp_glass=true;addHeartPiece();saveGame();}};}
function talkHolt(){if(F.shard4)return[L('Holt','Ten years a soldier. Lately the orders feel... wrong. Loading crying girls onto ships isn\'t what I signed up for.'),L('Holt','If you see Captain Venn, tell him Private Holt asked after him. He\'ll know what I mean.')];
  return[L('Holt','Halt! Royal cargo. No touching, no peeking, no asking.'),L('Holt','...Off the record? These museum bells go straight to the castle forge. Funny sort of museum.')];}
function talkBrine(){if(F.shard4)return[L('Brine','The Gilded Swan sailed at dawn without even signing my book! Most irregular.'),L('Brine','Still, the King knows best. ...Doesn\'t he?')];
  return[L('Brine','Harbormaster Brine, at your service! Port Gullhaven, finest little harbor in Gallowmark.'),L('Brine','Those crates? Royal cargo, very important. Old bells for His Majesty\'s new Bell Museum. Isn\'t that a lovely idea?'),
    L('Brine','Mind you, I\'ve never known a museum to need three hundred bells. But the King knows best!')];}
function talkWenna(){return F.maddox?[L('Wenna','Old Maddox talked your ear off, did he? Don\'t repeat any of it outside. Soldiers drink here.')]:[L('Wenna','Welcome to the Salted Gull! Soldiers drink free, by order of the crown. Everyone else pays double, by order of me.'),L('Wenna','Old Maddox in the corner tells tall tales. Some of them are even true.')];}
function talkMaddox(){if(F.maddox)return[L('Maddox','Gold as wheat, I tell you. Not black. I know what I saw.')];
  return{lines:[L('Maddox','Sit, sit. You have the look of someone who asks questions. Dangerous habit round here.'),
    L('Maddox','Night of the green star, I was mending nets on the long pier. The King\'s own ship, the Gilded Swan, came in with no lamps lit.'),
    L('Maddox','They carried a girl aboard. Wrapped in a sea-soaked cloak, with a silver circlet on her brow. And she was humming a little tune, sweet as a lullaby.'),
    L('Pip','Wren... a silver circlet. Like the girl in your dream.'),

/* ================= physics ================= */
function hitsSolid(x,y,hw,hh,fly,swim){const x0=Math.floor((x-hw)/TS),x1=Math.floor((x+hw-.01)/TS),y0=Math.floor((y-hh)/TS),y1=Math.floor((y+hh-.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const t=tileAt(tx,ty);if(SOLID[t]&&!(fly&&(t===T.PIT||t===T.WATER||t===T.LILY))&&!(swim&&(t===T.WATER||t===T.LILY)))return true;}return false;}
function blocked(e,x,y){if(hitsSolid(x,y,e.hw,e.hh,e.fly,e===P&&!!F.charm))return true;
  if(e===P&&S.id==='town'&&townGateShut(x,y,e))return true;
  if(e===P){for(const n of npcs)if(Math.abs(n.x-x)<n.hw+e.hw&&Math.abs(n.y-y)<n.hh+e.hh+1)return true;}
  else if(e.talk&&P){if(Math.abs(P.x-x)<P.hw+e.hw&&Math.abs(P.y-y)<P.hh+e.hh+1)return true;}
  return false;}
function moveBody(e,dx,dy,slide){
  if(dx){if(!blocked(e,e.x+dx,e.y))e.x+=dx;else{const s=Math.sign(dx);let m=Math.abs(dx);while(m>0){const st=Math.min(1,m);if(blocked(e,e.x+s*st,e.y))break;e.x+=s*st;m-=st;}
    if(slide&&Math.abs(dy)<.01)for(let k=1;k<=6;k++){if(!blocked(e,e.x+s,e.y-k)){if(!blocked(e,e.x,e.y-1))e.y-=1;break;}if(!blocked(e,e.x+s,e.y+k)){if(!blocked(e,e.x,e.y+1))e.y+=1;break;}}}}
  if(dy){if(!blocked(e,e.x,e.y+dy))e.y+=dy;else{const s=Math.sign(dy);let m=Math.abs(dy);while(m>0){const st=Math.min(1,m);if(blocked(e,e.x,e.y+s*st))break;e.y+=s*st;m-=st;}
    if(slide&&Math.abs(dx)<.01)for(let k=1;k<=6;k++){if(!blocked(e,e.x-k,e.y+s)){if(!blocked(e,e.x-1,e.y))e.x-=1;break;}if(!blocked(e,e.x+k,e.y+s)){if(!blocked(e,e.x+1,e.y))e.x+=1;break;}}}}
}

function burst(x,y,n,cols,spd,life,grav,size){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.4+Math.random()*.6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(grav?spd*.5:0),life:life*(.6+Math.random()*.4),max:life,col:cols[i%cols.length],g:grav||0,sz:size||1});}}
function ring(x,y,r,cols){for(let i=0;i<28;i++){const a=i/28*6.283;parts.push({x:x+Math.cos(a)*6,y:y+Math.sin(a)*4,vx:Math.cos(a)*r,vy:Math.sin(a)*r*.6,life:.45,max:.45,col:cols[i%cols.length],g:0,sz:2});}}

let dlg=null;
function say(lines,cb){if(!lines||!lines.length){if(cb)cb();return;}dlg={lines,i:0,shown:0,cb};$('dlg').hidden=false;mode='dialog';hint('');showLine();}
function showLine(){const l=dlg.lines[dlg.i];$('dlg-who').textContent=l.who;$('dlg-text').textContent='';$('dlg-more').hidden=true;dlg.shown=0;}
function advance(){if(!dlg)return;const l=dlg.lines[dlg.i];if(dlg.shown<l.text.length){dlg.shown=l.text.length;$('dlg-text').textContent=l.text;$('dlg-more').hidden=false;return;}
  dlg.i++;if(dlg.i>=dlg.lines.length){const cb=dlg.cb;dlg=null;$('dlg').hidden=true;mode='play';for(const k in edge)edge[k]=false;if(cb)cb();return;}showLine();}
function updateDialog(dt){if(!dlg)return;const l=dlg.lines[dlg.i];if(dlg.shown<l.text.length){const before=Math.floor(dlg.shown);dlg.shown=Math.min(l.text.length,dlg.shown+dt*50);const now=Math.floor(dlg.shown);
  if(now!==before){$('dlg-text').textContent=l.text.slice(0,now);if(now%3===0)SFX.blip();}if(dlg.shown>=l.text.length)$('dlg-more').hidden=false;}
  if(edge.sword||edge.roll){edge.sword=edge.roll=false;advance();}}
$('dlg').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();advance();});
function talkTo(n){const dx=P.x-n.x,dy=P.y-n.y;if(Math.abs(dx)>Math.abs(dy)){n.fx=Math.sign(dx);n.fy=0;}else{n.fx=0;n.fy=Math.sign(dy);}n.moving=false;n.walk=0;
  let res=n.talk(n);if(Array.isArray(res))res={lines:res};say(res.lines,res.after);}

  shots=[];S.slide=null;S.brazList=[];for(let i=0;i<map.length;i++)if(map[i]===T.BRAZ||map[i]===T.BRAZL)S.brazList.push([i%MW,(i/MW)|0]);if(S.brazTime&&!F[S.brazFlag])S.brazOut={};

function hurtPlayer(src,dmg,unblockable){

    burst(P.x+P.fx*8,P.y+P.fy*8-6,6,['#fff7d0','#f0c65a'],70,.25);return;}
  P.hp=Math.max(0,P.hp-dmg);P.inv=1.1;P.kbx=-Math.cos(ang)*170;P.kby=-Math.sin(ang)*170;P.kbT=.18;if(P.state==='attack'||P.state==='spin')P.state='normal';P.charge=0;if(P.state==='hook'){if(P.hk)for(const p of P.hk.carry)p.hooked=false;P.hk=null;P.state='normal';}
  SFX.hurt();shake(3,.25);hitstop=.06;updateHud();

function knock(e,vx,vy,t){if(e.boss||e.fixed)return;e.kbx=vx;e.kby=vy;e.kbT=t;if(e.state==='hop'||e.state==='dart'){e.state='idle';e.t=.5;if(e.kind!=='bat')e.z=0;}}
function damageEnemy(e,o){o=o||{};

      if(!F.guard_tip){F.guard_tip=true;toast('It blocks with its shield! Hit it after it lunges, strike from behind, or use a spin attack.',3.4);}return;}}
  if((e.kind==='beetle'||e.kind==='crab')&&e.state!=='flip'&&!o.spin){const[vx,vy]=DV[e.dir],tx=P.x-e.x,ty=P.y-e.y,l=Math.hypot(tx,ty)||1;

      if(!F.beetle_hint){F.beetle_hint=true;toast(F.hook?'Armored in front! Flip it with the Grapple Claw, or strike from behind.':'Armored in front! Strike it from behind.',3);}return;}}
  if(e.kind==='grim'||e.kind==='brine')e.t-=.22;
  let dmg=o.dmg||F.sword||1;if(o.spin)dmg*=2;e.hp-=dmg;e.flash=.13;const a=Math.atan2(e.y-P.y,e.x-P.x);const kb=e.kind==='big'||e.kind==='ratking'||e.kind==='captain'?90:170;knock(e,Math.cos(a)*kb,Math.sin(a)*kb,.18);

  if(e.kind==='brine'&&e.ph===0&&e.hp<=e.maxHp/2&&e.hp>0){e.ph=1;toast('Brinemaw is furious! Watch out for its bubbles!',2.6);}
  if(e.kind==='sentinel'&&e.ph===0&&e.hp<=e.maxHp/2&&e.hp>0){e.ph=1;toast('Ash is pouring out of the Sentinel!',2.4);shake(2,.5);burst(e.x,e.y-16,30,['#3a3240','#6a6170','#ff5a3c'],90,.8);}

  if(e.kind==='wraith'&&e.hp>0){e.rh=(e.rh||0)+1;if(e.rh>=5)e.t=0;}
  if(e.kind==='wraith'&&!e.ph&&e.hp<=e.maxHp/2&&e.hp>0){e.ph=1;e.t=0;toast('The Bogwraith calls up wisps from the water!',2.4);for(const s2 of[-1,1]){const w=mkEnemy('wisp',0,0);w.x=e.x+s2*30;w.y=e.y;enemies.push(w);}}
  if(e.hp<=0)killEnemy(e);}
function killEnemy(e){

  const cols=ecol(e);
  const bigOne=e.kind==='big'||e.kind==='ratking'||e.kind==='captain'||e.boss;burst(e.x,e.y-4-e.z,bigOne?30:14,cols,bigOne?120:80,.6,0,bigOne?2:1);

function drop(x,y,type){const a=Math.random()*6.283;pickups.push({x,y,vx:Math.cos(a)*30,vy:Math.sin(a)*30,z:0,vz:70,type,t:0});}
function cutAt(x,y){const tx=Math.floor(x/TS),ty=Math.floor(y/TS),k=tx+','+ty;if(P.cutSet.has(k))return;P.cutSet.add(k);const t=tileAt(tx,ty);
  if(t===T.BUSH||t===T.REED){setT(tx,ty,floorFor(tx,ty));repaint(tx,ty);SFX.cut();burst(tx*TS+8,ty*TS+8,12,t===T.REED?['#5e9e44','#86c45c','#7a4a2a']:['#4fa84a','#77c768','#2f7a35'],70,.55,140,1);const r=Math.random();if(r<.22)drop(tx*TS+8,ty*TS+8,'coin');else if(r<.32&&P.hp<P.maxHp)drop(tx*TS+8,ty*TS+8,'heart');}

    if(S.oreHits[k]>=2){setT(tx,ty,T.QG);repaint(tx,ty);burst(tx*TS+8,ty*TS+8,14,['#7e7884','#a39ca8','#e0803a'],80,.6,120,2);drop(tx*TS+8,ty*TS+8,'ore');shake(1,.15);}}}
function usePotion(){if(potions<=0)return;if(P.hp>=P.maxHp){toast('Your hearts are already full',1.5);return;}potions--;P.hp=P.maxHp;SFX.heart();burst(P.x,P.y-8,14,['#ff8aa0','#ffffff','#e58ad0'],60,.6,-20);updateHud(true);}

/* ---- dungeon systems ---- */
const HOOK_MAX=152;
function startHook(){let dx=P.fx,dy=P.fy;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  if(lock){const ax=lock.x-P.x,ay=lock.y-P.y,al=Math.hypot(ax,ay)||1;dx=ax/al;dy=ay/al;}
  else{let best=null,bs=1e9;const fa=Math.atan2(dy,dx);
    const consider=(x,y,tol,w)=>{const ax=x-P.x,ay=y-P.y,d=Math.hypot(ax,ay);if(d<(w===1?26:8)||d>HOOK_MAX+8)return;const ad=angDiff(Math.atan2(ay,ax),fa);if(ad>tol)return;const sc=ad*60+d*.15*w+(w>1?12:0);if(sc<bs){bs=sc;best=[ax/d,ay/d];}};
    for(const[tx,ty]of S.hookT||[])consider(tx*TS+8,ty*TS+8,.5,1);
    for(const e of enemies)if(!e.dead)consider(e.x,e.y,.38,1.2);
    if(best){dx=best[0];dy=best[1];}}
  P.fx=dx;P.fy=dy;P.state='hook';P.hk={dx,dy,d:0,ph:'out',carry:[]};P.moving=false;P.shield=false;SFX.hook();}
function hookLanding(tx,ty){let best=null,bd=1e9;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;const x=(tx+ox)*TS+8,y=(ty+oy)*TS+8;if(hitsSolid(x,y,P.hw,P.hh))continue;const d=Math.hypot(x-P.x,y-P.y);if(d<bd){bd=d;best=[x,y];}}return best;}
function endHook(){if(P.hk)for(const p of P.hk.carry)p.hooked=false;P.hk=null;P.state='normal';P.hookCd=.15;}
function updateHook(dt){const h=P.hk;if(!h){P.state='normal';return;}
  if(h.ph==='out'){let adv=360*dt;
    while(adv>0&&h.ph==='out'){const st=Math.min(4,adv);adv-=st;h.d+=st;const x=P.x+h.dx*h.d,y=P.y+h.dy*h.d;
      for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-x,(e.y-2)-y)<e.rad+3){hookEnemy(e);h.ph='back';break;}}
      if(h.ph!=='out')break;
      for(const p of pickups)if(!p.hooked&&!KEEP_P.has(p.type)&&Math.hypot(p.x-x,p.y-y)<10){p.hooked=true;h.carry.push(p);}
      const tx=Math.floor(x/TS),ty=Math.floor(y/TS),t=tileAt(tx,ty);
      if(t===T.POST&&Math.hypot(tx*TS+8-P.x,ty*TS+8-P.y)<26)continue;
      if(t===T.POST){const land=hookLanding(tx,ty);if(land){h.ph='zip';h.post=[tx*TS+8,ty*TS+8];h.land=land;SFX.latch();burst(tx*TS+8,ty*TS-2,6,['#fff1a8','#f0c65a'],60,.25);const ax=tx*TS+8-P.x,ay=ty*TS+8-P.y,al=Math.hypot(ax,ay)||1;P.fx=ax/al;P.fy=ay/al;}else{h.ph='back';SFX.clank();}break;}
      if(t===T.CRYSTAL){hitCrystal(tx,ty);h.ph='back';break;}
      if(SOLID[t]&&t!==T.PIT&&t!==T.WATER&&t!==T.LILY){h.ph='back';SFX.clank();burst(x,y-6,4,['#ffffff','#f0c65a'],60,.2);break;}
      if(h.d>=HOOK_MAX){h.ph='back';break;}}}
  else if(h.ph==='back'){h.d-=440*dt;const d=Math.max(0,h.d);for(const p of h.carry){p.x=P.x+h.dx*d;p.y=P.y+h.dy*d;p.vx=p.vy=0;p.z=0;p.vz=0;}if(h.d<=0)endHook();}
  else if(h.ph==='zip'){const[lx,ly]=h.land,ax=lx-P.x,ay=ly-P.y,d=Math.hypot(ax,ay),sp=300*dt;
    if(d<=sp){P.x=lx;P.y=ly;endHook();P.inv=Math.max(P.inv,.15);burst(P.x,P.y+3,6,['#8a8074','#ffffff'],40,.3);}
    else{P.x+=ax/d*sp;P.y+=ay/d*sp;}}}
function hookEnemy(e){
  if(e.kind==='beetle'||e.kind==='crab'){if(e.state!=='flip'){e.state='flip';e.t=2.6;SFX.latch();hitstop=.05;burst(e.x,e.y-4,8,['#ffffff','#6fc2b8'],70,.3);}return;}
  if(e.kind==='grim'||e.kind==='brine'){if(e.state==='wind'||e.state==='charge'){e.state='flip';e.t=2.6;SFX.latch();SFX.slam();shake(3,.4);hitstop=.08;burst(e.x,e.y-6,20,['#ffffff','#ff8a3a','#8a6a9a'],100,.5);if(!S.flipHint){S.flipHint=true;toast('It flipped over! Strike its soft belly!',2.4);}}
    else{SFX.clank();burst(e.x,e.y-8,5,['#ffffff','#c8d0dc'],80,.2);if(!S.hookHint){S.hookHint=true;toast('The claw bounces off. Wait until its jaws open!',2.4);}}return;}
  if(e.kind==='guard'||e.kind==='captain'){if(e.state!=='recover'){e.state='recover';e.t=e.kind==='captain'?1.1:1.5;SFX.latch();hitstop=.05;burst(e.x,e.y-8,8,['#ffffff','#d8b050'],70,.3);if(!F.yank_tip){F.yank_tip=true;toast('The claw yanked its shield aside! Strike now!',2.4);}}return;}
  if(e.kind==='wisp')return;
  if(e.kind==='plant'&&e.state==='hide'){SFX.clank();return;}
  if(e.boss){SFX.clank();return;}
  SFX.hit();e.hp-=1;e.flash=.13;e.stun=1.3;const a=Math.atan2(P.y-e.y,P.x-e.x);knock(e,Math.cos(a)*90,Math.sin(a)*90,.15);burst(e.x,e.y-5-e.z,5,['#fff1a8','#ffffff'],60,.25);if(e.hp<=0)killEnemy(e);}
function hitCrystal(tx,ty){if(!S.crystalFlag||F[S.crystalFlag]){SFX.clank();return;}F[S.crystalFlag]=true;for(let i=0;i<map.length;i++)if(map[i]===T.BARS)map[i]=T.DOOR;
  SFX.gate();burst(tx*TS+8,ty*TS,16,['#ffb040','#fff0a0','#ffffff'],80,.5);shake(1.5,.3);toast('The crystal flares orange. Bars rumble open nearby!',2.6);saveGame();}
function tryDoor(nx,ny){const tx=Math.floor((P.x+nx*(P.hw+3))/TS),ty=Math.floor((P.y+ny*(P.hh+3))/TS),t=tileAt(tx,ty);
  if(t!==T.LOCK&&t!==T.BIGLOCK)return;

  if(t===T.LOCK){if((F[kf]||0)>0){F[kf]--;F[S.lockFlag]=true;openGroup(tx,ty,t);toast('Unlocked!',1.6);}else if(toastT<=0)toast('Locked. A small key would open this door.',2);}
  else{if(F[bk]){F[S.bigFlag]=true;openGroup(tx,ty,t);toast('The '+bn+' turns with a deep clang!',2.2);}else if(toastT<=0)toast('A great lock shaped like a bell. You need a special key.',2.2);}}
function openGroup(tx,ty,t){const st=[[tx,ty]];while(st.length){const[x,y]=st.pop();if(tileAt(x,y)!==t)continue;setT(x,y,T.DOOR);burst(x*TS+8,y*TS+8,8,['#f0c65a','#ffffff','#8a94a8'],60,.4);st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}

function nudgeOut(){if(!hitsSolid(P.x,P.y,P.hw,P.hh))return;const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);for(let r=1;r<=3;r++)for(let oy=-r;oy<=r;oy++)for(let ox=-r;ox<=r;ox++){const x=(tx+ox)*TS+8,y=(ty+oy)*TS+8;if(!hitsSolid(x,y,P.hw,P.hh)){P.x=x;P.y=y;return;}}}

function updateBeetle(e,dt,dist,dxp,dyp){const boss=e.kind==='grim'||e.kind==='brine',brine=e.kind==='brine',p2=boss&&e.ph===1;e.t-=dt;e.cd=Math.max(0,(e.cd||0)-dt);

    if(e.t<=0||stuck){e.dir=Math.random()<(boss?.85:.65)?dirTo(dxp,dyp):(Math.random()*4)|0;e.t=boss?.6+Math.random()*.5:.6+Math.random()*.9;

    if(e.state==='walk'&&e.cd<=0&&dist<(boss?170:110)&&(Math.abs(dxp)<(boss?12:9)||Math.abs(dyp)<(boss?12:9))){const d=dirTo(dxp,dyp);if(boss||d===e.dir){e.dir=d;e.state='wind';e.t=boss?(p2?.55:.8):.4;}}}
  else if(e.state==='wind'){if(e.t<=0){e.state='charge';e.t=boss?2.5:1;if(boss)SFX.roar();if(brine&&p2)for(const sp of[-.4,0,.4])fireAt(e,P.x,P.y,125,'bubble',1,sp);}}
  else if(e.state==='charge'){const sp=boss?(p2?235:190):115,[vx,vy]=DV[e.dir],ox=e.x,oy=e.y;moveBody(e,vx*sp*dt,vy*sp*dt);
    if(boss&&Math.random()<.5)parts.push({x:e.x-vx*12,y:e.y+6,vx:0,vy:-10,life:.35,max:.35,col:'#8a8074',g:0,sz:2});

        if(brine){if(!S.dazeHint){S.dazeHint=true;toast('It\'s dazed! Strike now!',1.8);}if(p2&&enemies.filter(o=>o.kind==='crab'&&!o.dead).length<2)for(const s2 of[-1,1]){const c=mkEnemy('crab',0,0);c.x=e.x+s2*30;c.y=e.y+22;if(hitsSolid(c.x,c.y,c.hw,c.hh)){c.x=e.x;c.y=e.y+24;}enemies.push(c);}}}

  else if(e.state==='daze'){if(e.t<=0){e.state='walk';e.t=.4;}}

function fireLamp(){if(!F.lantern||P.lampCd>0)return;let dx=P.fx,dy=P.fy;if(lock){dx=lock.x-P.x;dy=lock.y-P.y;}const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  shots.push({kind:'flame',x:P.x+dx*8,y:P.y-4+dy*6,vx:dx*230,vy:dy*230,life:.34,from:'p',r:6,hit:new Set()});P.lampCd=.45;SFX.flame();}

function floorFor(tx,ty){if(S.indoor)return(tx===0||ty===0||tx===MW-1||ty===MH-1)?T.DOOR:S.floor;return S.id==='quarry'?T.QG:T.GRASS;}
function burnVine(tx,ty){const st=[[tx,ty]];let n=0;while(st.length){const[x,y]=st.pop();if(tileAt(x,y)!==T.VINE)continue;setT(x,y,floorFor(x,y));n++;burst(x*TS+8,y*TS+6,14,FIRE.concat(['#2a1838']),70,.7,-30,2);repaint(x,y);st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}

function updateBraziers(dt){if(!S.brazOut)return;for(const k in S.brazOut){if(S.brazOut[k]<=0)continue;S.brazOut[k]-=dt;if(S.brazOut[k]<=0){const[x,y]=k.split(',').map(Number);if(tileAt(x,y)===T.BRAZL){setT(x,y,T.BRAZ);burst(x*TS+8,y*TS,8,['#6a6274','#3a3440','#8a8298'],30,.6,-20);SFX.fizz();}}}}
function flameTile(tx,ty){const t=tileAt(tx,ty);
  if(t===T.BRAZ){lightBrazier(tx,ty);return true;}if(t===T.BRAZL)return true;
  if(t===T.VINE){burnVine(tx,ty);return true;}

function flameHit(e){burst(e.x,e.y-6-e.z,10,FIRE,70,.4,-30);
  if(e.kind==='wisp'||e.kind==='plant'){e.hp=0;killEnemy(e);return;}
  if(e.kind==='wraith'){if(e.state!=='reveal'&&e.state!=='shriek')wraithReveal(e,2.6);return;}
  if(e.kind==='guard'||e.kind==='captain'){e.state='recover';e.t=1.1;e.flash=.13;SFX.hit();return;}
  if(e.boss||((e.kind==='beetle'||e.kind==='crab')&&e.state!=='flip')){SFX.clank();return;}
  e.hp-=1;e.flash=.13;e.stun=.9;SFX.hit();if(e.hp<=0)killEnemy(e);}
function updateShots(dt){for(const s of shots){s.life-=dt;if(s.life<=0)continue;
  for(let k=0;k<3&&s.life>0;k++){s.x+=s.vx*dt/3;s.y+=s.vy*dt/3;const tx=Math.floor(s.x/TS),ty=Math.floor((s.y+4)/TS),t=tileAt(tx,ty);const passable=!SOLID[t]||t===T.PIT||t===T.WATER||t===T.LILY;
    if(s.kind==='flame'){if(flameTile(tx,ty)){s.life=0;break;}if(!passable){s.life=0;burst(s.x,s.y,6,FIRE,50,.3);break;}
      for(const e of enemies)if(!e.dead&&!s.hit.has(e)&&Math.hypot(e.x-s.x,(e.y-e.z*.6-4)-s.y)<e.rad+6){s.hit.add(e);flameHit(e);}
      if(Math.random()<.7)parts.push({x:s.x+(Math.random()-.5)*6,y:s.y+(Math.random()-.5)*6,vx:-s.vx*.1,vy:-20,life:.35,max:.35,col:FIRE[(Math.random()*4)|0],g:-30,sz:2});continue;}
    if(!passable){s.life=0;burst(s.x,s.y,5,s.kind==='orb'?['#b080ff','#ffffff']:['#c8e07a','#7a5a2a'],50,.3);break;}
    if(s.from==='e'){if(mode==='play'&&Math.hypot(P.x-s.x,P.y-6-s.y)<s.r+5){const ang=Math.atan2(s.y-P.y,s.x-P.x),fa=Math.atan2(P.fy,P.fx);
        if(P.shield&&P.state==='normal'&&angDiff(ang,fa)<1.3){SFX.block();burst(s.x,s.y,6,['#fff7d0','#f0c65a'],60,.25);
          if(s.kind==='seed'&&s.src&&!s.src.dead){const dx=s.src.x-s.x,dy=s.src.y-6-s.y,l=Math.hypot(dx,dy)||1;s.vx=dx/l*210;s.vy=dy/l*210;s.from='p';s.life=2;if(!F.reflect_tip){F.reflect_tip=true;toast('Your shield knocked the seed right back!',2.2);}}else s.life=0;break;}

    else{for(const e of enemies)if(!e.dead&&Math.hypot(e.x-s.x,e.y-6-e.z*.5-s.y)<e.rad+4){if(e.kind==='plant'){e.hp=0;killEnemy(e);}else damageEnemy(e,{dmg:2,ranged:true});s.life=0;break;}}}}
  shots=shots.filter(s=>s.life>0);}
function drawShot(s,cx,cy){const x=Math.round(s.x-cx),y=Math.round(s.y-cy);
  if(s.kind==='flame'){for(let i=0;i<3;i++){ctx.fillStyle=FIRE[i];const r=5-i*1.5;ctx.beginPath();ctx.arc(x,y,r+Math.sin(time*30+i)*.8,0,7);ctx.fill();}return;}

function tryPush(nx,ny,dt,moved){if(!S.plates||moved||P.shield){P.push=0;return;}const card=Math.abs(nx)>.8?[Math.sign(nx),0]:Math.abs(ny)>.8?[0,Math.sign(ny)]:null;if(!card){P.push=0;return;}
  const tx=Math.floor((P.x+card[0]*(P.hw+3))/TS),ty=Math.floor((P.y+card[1]*(P.hh+3))/TS);if(tileAt(tx,ty)!==T.BLOCK||S.slide){P.push=0;return;}
  P.push+=dt;if(P.push<.3)return;P.push=0;const bx=tx+card[0],by=ty+card[1],dest=tileAt(bx,by);
  if(!(dest===S.floor||dest===T.PLATE)||enemies.some(e=>!e.dead&&Math.floor(e.x/TS)===bx&&Math.floor(e.y/TS)===by)){SFX.thud();return;}
  setT(tx,ty,S.plates.has(tx+','+ty)?T.PLATE:S.floor);setT(bx,by,T.BLOCK);S.slide={x0:tx,y0:ty,x1:bx,y1:by,t:0};SFX.scrape();repaint(tx,ty);repaint(bx,by);checkPlates();}
