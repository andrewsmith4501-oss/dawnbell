<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dawnbell</title>
<meta name="description" content="Dawnbell: The Warden's Trial and The Hollow Deep. A top-down action adventure for your phone.">
<meta name="theme-color" content="#0e1811">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dawnbell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed pixel canvas; thumb controls pinned to the two lower corners */
:root{
  --ink:#f6eed9; --ink-dim:#c9c0a6; --night:#0e1811; --panel:rgba(20,16,11,.92);
  --edge:#e6c068; --edge-dark:#7a5a22;
  --b-sword:#f0c65a; --b-shield:#86bdf0; --b-roll:#93d67c; --b-target:#ef8270; --b-item:#e58ad0; --b-hook:#f0a050;
  --ui:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
#app{position:fixed;inset:0;overflow:hidden;background:#0b0a08}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--ui);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--edge);outline-offset:3px}

#hud{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;pointer-events:none}
#hearts{display:flex;gap:2px;flex-wrap:wrap;max-width:200px}
#hearts img{width:27px;height:24px;image-rendering:pixelated}
#counts{display:flex;gap:14px;font:600 16px var(--ui);text-shadow:0 2px 0 #000,0 0 4px #000;font-variant-numeric:tabular-nums}
#counts span{display:flex;align-items:center;gap:5px}
#counts img{image-rendering:pixelated}
#place{position:absolute;left:50%;top:28%;transform:translateX(-50%);font:700 28px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#fff3cf;text-shadow:0 3px 0 #2a1d09,0 0 18px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap}
#boss{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(320px,40%);pointer-events:none;text-align:center}
#boss b{display:block;font:700 14px var(--ui);letter-spacing:.1em;text-transform:uppercase;text-shadow:0 2px 0 #000;margin-bottom:3px}
#boss .bar{height:10px;border:2px solid #1b1420;background:#3a2a2a;box-shadow:0 0 0 2px var(--edge-dark)}
#boss .fill{height:100%;background:linear-gradient(#ff8a6a,#d8453a);transition:width .2s}

#pause{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:10px;border:2px solid rgba(246,238,217,.5);background:rgba(20,16,11,.5);font:700 15px var(--ui);letter-spacing:2px}

#hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:56%;padding:7px 14px;border-radius:8px;background:var(--panel);border:2px solid var(--edge-dark);font:500 15px var(--ui);text-align:center;pointer-events:none}
#toast{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:rgba(20,16,11,.8);font:500 15px var(--ui);pointer-events:none;max-width:70%;text-align:center}

#stickzone{position:absolute;left:0;bottom:0;width:45%;height:80%;touch-action:none}
#stick{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(246,238,217,.35);background:rgba(20,16,11,.28);pointer-events:none;opacity:.45;transition:opacity .15s}
#stick.live{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(246,238,217,.55);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}

.btn{position:absolute;border-radius:50%;border:3px solid currentColor;background:rgba(20,16,11,.42);display:grid;place-items:center;touch-action:none;font:700 13px var(--ui);letter-spacing:.04em;text-transform:uppercase;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);padding:0}
.btn span{color:var(--ink);text-shadow:0 1px 0 #000;line-height:1.1;text-align:center}
.btn.on{background:rgba(246,238,217,.28);transform:scale(.93)}
.btn.lit{background:rgba(239,130,112,.35)}
#b-sword{color:var(--b-sword);width:86px;height:86px;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:15px}
#b-shield{color:var(--b-shield);width:62px;height:62px;right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#b-roll{color:var(--b-roll);width:62px;height:62px;right:calc(34px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))}
#b-target{color:var(--b-target);width:58px;height:58px;right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));font-size:12px}
#b-item{color:var(--b-item);width:54px;height:54px;right:calc(192px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:11px}
#b-hook{color:var(--b-hook);width:56px;height:56px;right:calc(194px + env(safe-area-inset-right,0px));bottom:calc(102px + env(safe-area-inset-bottom,0px));font-size:12px}

#dlg{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#dlg .box{width:min(660px,66%);min-height:78px;padding:12px 18px 14px;background:var(--panel);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 3px #120e09,0 6px 20px rgba(0,0,0,.5);position:relative}
#dlg-who{font:700 15px var(--ui);color:var(--edge);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase;min-height:4px}
#dlg-text{font:500 18px/1.35 var(--ui);min-height:48px}
#dlg-more{position:absolute;right:14px;bottom:8px;color:var(--edge);font-size:14px;animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#title{background:linear-gradient(180deg,rgba(8,14,9,.35),rgba(8,14,9,.82) 70%)}
#title .inner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
#title h1{margin:0;font:700 clamp(44px,11vh,88px)/1 var(--ui);letter-spacing:.12em;color:#fff3cf;text-shadow:0 4px 0 #6b4a17,0 8px 0 #2a1d09,0 0 30px rgba(240,198,90,.45)}
#title .sub{font:500 18px var(--ui);color:var(--ink-dim);letter-spacing:.08em}
#title .note{font:400 13px var(--ui);color:var(--ink-dim);opacity:.8;margin-top:8px}
#title .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta{margin-top:14px;padding:12px 30px;font:700 19px var(--ui);letter-spacing:.1em;text-transform:uppercase;background:#2b1f0d;border:3px solid var(--edge);border-radius:8px;box-shadow:0 4px 0 #120e09}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #120e09}
.card{background:var(--panel);border:3px solid var(--edge);border-radius:8px;box-shadow:0 0 0 3px #120e09;padding:16px 24px;max-width:560px;max-height:calc(100% - 20px);overflow:auto;text-align:center}
.card h2{margin:0 0 8px;font:700 24px var(--ui);color:#fff3cf;letter-spacing:.04em}
.card p{margin:0 0 6px;font:400 16px/1.4 var(--ui);color:var(--ink)}
.card .goal{text-align:left;background:rgba(0,0,0,.25);border-radius:6px;padding:8px 12px;margin:6px 0}
.card .goal div{font:400 15px/1.4 var(--ui)}
.card .goal div::before{content:"\25B8  ";color:var(--edge)}
.card .tokens{display:flex;gap:8px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.card .tokens span{font:600 13px var(--ui);padding:3px 9px;border-radius:12px;border:2px solid #4a3d2a;color:var(--ink-dim)}
.card .tokens span.got{border-color:var(--edge);color:#fff3cf;background:rgba(240,198,90,.18)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.card .row button{padding:9px 18px;font:600 16px var(--ui);background:#2b1f0d;border:2px solid var(--edge);border-radius:6px}
.card .row button:disabled{opacity:.45;cursor:default}
.card .keys{font-size:13px;color:var(--ink-dim);margin-top:10px;line-height:1.5}
.card canvas.map{display:block;width:100%;max-width:400px;margin:2px auto 0;border:3px solid #6b4a17;border-radius:4px;box-shadow:0 0 0 2px #120e09}

#rotate{display:none;position:absolute;inset:0;background:var(--night);z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#rotate .phone{width:46px;height:78px;border:4px solid var(--edge);border-radius:9px;animation:turn 2s ease-in-out infinite}
#rotate p{font:500 20px var(--ui);margin:0}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#rotate .phone,#dlg-more{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Game view"></canvas>
  <div id="hud" hidden>
    <div id="hearts"></div>
    <div id="counts"><span><img id="ic-coin" alt="" width="16" height="16"><b id="n-coin">0</b></span><span id="c2"><img id="ic-2" alt="" width="24" height="19"><b id="n-2">0</b></span></div>
  </div>
  <div id="place" hidden></div>
  <div id="boss" hidden><b id="boss-name">Iron Sentinel</b><div class="bar"><div class="fill" id="boss-fill"></div></div></div>
  <div id="hint" hidden></div>
  <div id="toast" hidden></div>
  <div id="controls" hidden>
    <div id="stickzone"></div>
    <div id="stick"><div id="knob"></div></div>
    <button class="btn" id="b-item" aria-label="Use potion" hidden><span id="item-label">Potion</span></button>
    <button class="btn" id="b-hook" aria-label="Grapple Claw" hidden><span>Claw</span></button>
    <button class="btn" id="b-target" aria-label="Lock on"><span>Target</span></button>
    <button class="btn" id="b-roll" aria-label="Roll"><span>Roll</span></button>
    <button class="btn" id="b-shield" aria-label="Shield"><span>Shield</span></button>
    <button class="btn" id="b-sword" aria-label="Sword"><span id="sword-label">Sword</span></button>
    <button id="pause" aria-label="Pause">II</button>
  </div>
  <div id="dlg" hidden><div class="box"><div id="dlg-who"></div><div id="dlg-text"></div><div id="dlg-more">&#9660;</div></div></div>

  <div id="title" class="screen">
    <div class="inner">
      <h1>DAWNBELL</h1>
      <div class="sub">The Warden's Trial &middot; The Hollow Deep</div>
      <div class="ctas"><button class="cta" id="continue" hidden>Continue</button><button class="cta" id="start">New game</button></div>
      <div class="note">Hold your phone sideways &middot; progress saves on this device</div>
    </div>
  </div>
  <div id="menu" class="screen" hidden>
    <div class="card">
      <h2 id="menu-h">Paused</h2>
      <div id="menu-body"></div>
      <div class="row" id="menu-row"></div>
      <div class="keys" id="menu-keys"></div>
    </div>
  </div>
  <div id="rotate"><div class="phone"></div><p>Turn your phone sideways to play</p></div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
const VH=216,TS=16;
let VW=384,MW=52,MH=32;
function resize(){const w=innerWidth||800,h=innerHeight||450;VW=Math.max(260,Math.min(560,Math.round(VH*w/h)));cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();

/* ================= helpers ================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;if(fn)fn(g,c);return c;}
function sil(c,col){return mk(c.width,c.height,g=>{g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);});}
function outlined(c,col){const s=sil(c,col||'#1b1420');return mk(c.width+2,c.height+2,g=>{g.drawImage(s,0,1);g.drawImage(s,2,1);g.drawImage(s,1,0);g.drawImage(s,1,2);g.drawImage(c,1,1);});}
function flipH(c){return mk(c.width,c.height,g=>{g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);});}
const R=(g,col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
function blob(g,col,cx,cy,rx,ry){g.fillStyle=col;for(let y=-ry;y<ry;y++){const yy=(y+.5)/ry;const w=Math.round(rx*Math.sqrt(Math.max(0,1-yy*yy)));if(w>0)g.fillRect(cx-w,cy+y,w*2,1);}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d);};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ================= people sprites ================= */
const PAL={
  wren:{tun:'#3f9a46',tunD:'#2b6e35',tunL:'#64c15e',hair:'#8b5a2b',hairD:'#6e441d',skin:'#f3c69b',skinD:'#d99e72',belt:'#6e4320',buck:'#f0c65a',hood:true},
  guard:{tun:'#8a94a8',tunD:'#5d667a',tunL:'#c2cad8',hair:'#3a2a1a',hairD:'#2a1d12',skin:'#e8b88a',skinD:'#c99068',belt:'#3a3a48',buck:'#c2cad8',hood:true,hoodC:'#6d778c',legs:'#5d667a'},
  fen:{tun:'#7a4f9a',tunD:'#553570',tunL:'#9c72bd',hair:'#2a1f1a',hairD:'#1a120e',skin:'#e0a878',skinD:'#bf8659',belt:'#3a2a1a',hood:true,hoodC:'#4a2f63'},
  odo:{tun:'#7a5232',tunD:'#553820',tunL:'#9a6c48',hair:'#a8a8a8',hairD:'#7a7a7a',skin:'#c98f62',skinD:'#a8704a',belt:'#2a1d12',beard:'#b8b8b8',legs:'#4a3a30'},
  marla:{tun:'#c0453a',tunD:'#8e2f28',tunL:'#e06a5a',hair:'#e07a2e',hairD:'#b85a1a',skin:'#f3c69b',skinD:'#d99e72',belt:'#f3ead6',robe:true},
  aldous:{tun:'#e8e2d0',tunD:'#bdb5a0',tunL:'#ffffff',hair:'#f2f2f2',hairD:'#cfcfcf',skin:'#efc19a',skinD:'#d09a72',belt:'#c9a24a',robe:true,beard:'#f2f2f2'},
  venn:{tun:'#9fb1c8',tunD:'#6c7d96',tunL:'#d0dbea',hair:'#1f1a1a',hairD:'#100c0c',skin:'#d9a77c',skinD:'#b8865c',belt:'#8a1f2a',buck:'#f0c65a',legs:'#5a6378'},
  tilda:{tun:'#e0b23a',tunD:'#b48a22',tunL:'#f4d47a',hair:'#7a4a2a',hairD:'#5a341c',skin:'#f3c69b',skinD:'#d99e72',belt:'#6e4320',robe:true},
  bram:{tun:'#5a8ac8',tunD:'#3f6699',tunL:'#86aee0',hair:'#3a2a1a',hairD:'#2a1d12',skin:'#e8b88a',skinD:'#c99068',belt:'#3a2a1a'},
  hilde:{tun:'#9a6a8a',tunD:'#704a64',tunL:'#c08aac',hair:'#d8b060',hairD:'#b08a40',skin:'#f3c69b',skinD:'#d99e72',belt:'#4a2a3a',robe:true},
  tomas:{tun:'#6a8a4a',tunD:'#4a6634',tunL:'#8aac68',hair:'#5a3a22',hairD:'#3a2414',skin:'#c98f62',skinD:'#a8704a',belt:'#3a2a1a'},
  patron:{tun:'#8a5a3a',tunD:'#64402a',tunL:'#aa7a58',hair:'#c8c0b0',hairD:'#a09888',skin:'#e8b88a',skinD:'#c99068',belt:'#3a2a1a',beard:'#c8c0b0'},
  morrow:{tun:'#2a2234',tunD:'#16111d',tunL:'#4a3e5a',hair:'#d8d8e0',hairD:'#a8a8b4',skin:'#e6d2c0',skinD:'#c4ad9a',belt:'#8a6ac8',buck:'#f0c65a',robe:true},
};
function personBase(dir,f,p){return mk(16,16,g=>{
  const boot=p.boot||'#5a3a20',legs=p.legs||'#efe3c4',hoodC=p.hoodC||p.tun;
  if(dir<2){
    if(!p.robe){R(g,legs,5,12,2,2);R(g,legs,9,12,2,2);}
    R(g,boot,5,f?13:14,2,2);R(g,boot,9,f?14:13,2,2);
    R(g,p.tun,4,8,8,p.robe?6:5);R(g,p.tunD,4,p.robe?13:12,8,1);R(g,p.tunL,5,8,2,1);
    R(g,p.belt,4,11,8,1);if(dir===0&&p.buck)R(g,p.buck,7,11,2,1);
    R(g,p.tun,3,8,1,2);R(g,p.tun,12,8,1,2);R(g,p.skin,3,10,1,2);R(g,p.skin,12,10,1,2);
    R(g,p.skin,4,3,8,6);
    if(dir===0){R(g,p.hair,4,3,8,2);R(g,p.hair,4,5,2,1);R(g,p.hair,10,5,2,1);R(g,'#1e2a44',6,6,1,2);R(g,'#1e2a44',9,6,1,2);R(g,p.skinD,4,8,8,1);if(p.beard){R(g,p.beard,5,7,6,2);R(g,p.beard,6,9,4,1);}}
    else{R(g,p.hair,4,3,8,6);R(g,p.hairD,5,7,6,1);}
    if(p.hood){R(g,hoodC,4,1,8,2);R(g,hoodC,3,2,1,5);R(g,hoodC,12,2,1,5);R(g,p.tunL,5,1,3,1);if(dir===1){R(g,hoodC,4,2,8,4);R(g,p.tunD,6,6,4,2);R(g,p.tunD,7,8,2,2);}}
    else{R(g,p.hair,4,2,8,2);R(g,p.hair,3,3,1,4);R(g,p.hair,12,3,1,4);R(g,p.hairD,5,2,4,1);}
  }else{
    if(!p.robe)R(g,legs,6,12,4,2);
    R(g,boot,f?4:6,14,2,2);R(g,boot,f?9:8,14,2,2);
    R(g,p.tun,5,8,6,p.robe?6:5);R(g,p.tunD,5,p.robe?13:12,6,1);R(g,p.belt,5,11,6,1);
    R(g,p.skin,5,3,7,6);R(g,p.hair,5,3,7,2);R(g,p.hair,5,5,3,2);R(g,'#1e2a44',10,6,1,2);R(g,p.skinD,6,8,6,1);
    if(p.beard)R(g,p.beard,8,7,4,2);

function objectives(){
  if(!F.forest_clear)return['Clear every slime in the Whisperwood, then take the path east.'];
  if(!F.inside&&!F.quest)return['Find a way into Brackenford. The guards won\'t open the west gate.'];
  if(!F.quest)return['Find the Hall of Wardens, past Brackenford\'s east gate.'];
  if(!(F.courage&&F.craft&&F.kindness)){const o=[];
    if(!F.courage)o.push(F.rats_clear?'Tell Marla her cellar is clear.':F.cellar_open?'Clear the giant rats from the Rusty Kettle cellar.':'Courage: talk to Marla at the Rusty Kettle inn.');
    if(!F.craft)o.push(F.odo_asked?`Bring iron ore from the Old Quarry to Odo (${Math.min(3,F.ore||0)} of 3).`:'Craft: talk to Odo at the smithy.');
    if(!F.kindness)o.push(F.bell?'Return the silver bell to Brother Aldous.':F.bell_quest?'Find whoever took the chapel bell. A youth in purple was seen heading for the Old Quarry.':'Kindness: talk to Brother Aldous at the chapel.');
    return o;}
  if(!F.hall_open)return['Show all three tokens to Captain Venn outside the Hall of Wardens.'];
  if(!F.boss_done)return['Enter the Hall of Wardens and face the trial.'];
  if(!F.ch2)return['Captain Venn has news. Find him inside the Hall of Wardens.'];
  if(!F.hd_done){const o=['Explore the Hollow Deep, through the broken seal at the north end of the Old Quarry.'];
    if(!F.hook)o.push('Somewhere below lies a relic of the first Wardens.');else if(!F.hd_bk)o.push('Use the Grapple Claw to cross the chasms and find the great key.');else o.push('Open the great door in the Pillar Hall.');return o;}
  return['Chapter two is complete. Two shards of the Dawnbell are safe, for now.'];}

function buildForest(){

  for(const[cx,cy,rad]of[[24,9,2.6],[31,25,2.2],[38,9,2.3],[19,27,1.8],[43,24,2.4],[27,14,1.3]])for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(Math.hypot(x,y)<rad+r()*.6)g.set(cx+x,cy+y,T.TREE);
  for(let y=5;y<16;y++)for(let x=6;x<24;x++){const dx=(x-14)/5.5,dy=(y-10)/3.2;if(dx*dx+dy*dy<1)g.set(x,y,T.WATER);else if(dx*dx+dy*dy<1.5&&g.get(x,y)===T.TREE)g.set(x,y,T.GRASS);}
  const pts=[[9,21],[15,22],[22,20],[29,18],[36,17],[44,16],[51,16]];
  for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c,d]=pts[i+1];for(let s=0;s<=1;s+=.04){const x=a+(c-a)*s,y=b+(d-b)*s;
    for(let oy=-2;oy<=3;oy++)for(let ox=-2;ox<=2;ox++){const tx=Math.round(x)+ox,ty=Math.round(y)+oy;if(g.get(tx,ty)===T.TREE&&tx>0&&ty>0&&tx<W-1&&ty<H-1)g.set(tx,ty,T.GRASS);}
    for(let oy=0;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)g.set(Math.round(x)+ox,Math.round(y)+oy,T.PATH);}}
  for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(Math.hypot(x,y)<3.2){const t=g.get(START.x+x,START.y+y);if(t===T.TREE||t===T.WATER)g.set(START.x+x,START.y+y,T.GRASS);}
  const nearPath=(x,y)=>{for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)if(g.get(x+ox,y+oy)===T.PATH)return true;return false;};
  const place=(t,n)=>{for(let i=0;i<n;i++){const x=3+((r()*(W-6))|0),y=3+((r()*(H-6))|0);const cur=g.get(x,y);if((cur===T.GRASS||cur===T.FLOWER)&&!nearPath(x,y)&&Math.hypot(x-START.x,y-START.y)>3.5)g.set(x,y,t);}};
  place(T.BUSH,90);place(T.ROCK,16);place(T.STUMP,5);
  for(let y=12;y<=21;y++)for(let x=W-6;x<W;x++)if(y!==16&&y!==17)g.set(x,y,T.TREE);
  for(let x=W-6;x<W;x++){g.set(x,16,T.PATH);g.set(x,17,T.PATH);}

  const en=[];const r2=rng(21);let n=0,guard=0;const want=F.forest_clear?3:7;
  while(n<want&&guard++<500){const x=4+((r2()*(W-12))|0),y=4+((r2()*(H-8))|0);const t=g.get(x,y);if((t===T.GRASS||t===T.FLOWER)&&Math.hypot(x-START.x,y-START.y)>9){en.push(mkEnemy('slime',x,y));n++;}}
  if(!F.forest_clear)en.push(mkEnemy('big',41,16));
  return{id:'forest',name:'The Whisperwood',w:W,h:H,g,outdoor:true,enemies:en,npcs:[],gate:F.forest_clear?2:0,gateT:0,
    signs:{'12,19':[L('Sign','WHISPERWOOD. East path: Brackenford. Travelers, mind the slimes.')],'44,14':[L('Sign','These brambles feed on slime. Clear the woods of every slime and they will wither away.')]},
    exits:[{x0:W-1,y0:15,x1:W-1,y1:18,to:'town',tx:1,ty:19,face:'R'}]};
}

  rows.forEach((row,y)=>{if(row.length!==W)console.warn('room row width',id,y,row.length);[...row].forEach((ch,x)=>{let t=M[ch];if(t===undefined)t=T.STONE;
    if(t===T.BARS&&o.crystalFlag&&F[o.crystalFlag])t=T.DOOR;if(t===T.LOCK&&F[o.lockFlag])t=T.DOOR;if(t===T.BIGLOCK&&F[o.bigFlag])t=T.DOOR;if(t===T.TORCH)torches.push([x,y]);g.set(x,y,t);});});

/* ================= physics ================= */
function hitsSolid(x,y,hw,hh,fly){const x0=Math.floor((x-hw)/TS),x1=Math.floor((x+hw-.01)/TS),y0=Math.floor((y-hh)/TS),y1=Math.floor((y+hh-.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const t=tileAt(tx,ty);if(SOLID[t]&&!(fly&&t===T.PIT))return true;}return false;}
function blocked(e,x,y){if(hitsSolid(x,y,e.hw,e.hh,e.kind==='bat'))return true;
  if(e===P){for(const n of npcs)if(Math.abs(n.x-x)<n.hw+e.hw&&Math.abs(n.y-y)<n.hh+e.hh+1)return true;}
  else if(e.talk&&P){if(Math.abs(P.x-x)<P.hw+e.hw&&Math.abs(P.y-y)<P.hh+e.hh+1)return true;}
  return false;}
function moveBody(e,dx,dy,slide){
  if(dx){if(!blocked(e,e.x+dx,e.y))e.x+=dx;else{const s=Math.sign(dx);let m=Math.abs(dx);while(m>0){const st=Math.min(1,m);if(blocked(e,e.x+s*st,e.y))break;e.x+=s*st;m-=st;}
    if(slide&&Math.abs(dy)<.01)for(let k=1;k<=6;k++){if(!blocked(e,e.x+s,e.y-k)){if(!blocked(e,e.x,e.y-1))e.y-=1;break;}if(!blocked(e,e.x+s,e.y+k)){if(!blocked(e,e.x,e.y+1))e.y+=1;break;}}}}
  if(dy){if(!blocked(e,e.x,e.y+dy))e.y+=dy;else{const s=Math.sign(dy);let m=Math.abs(dy);while(m>0){const st=Math.min(1,m);if(blocked(e,e.x,e.y+s*st))break;e.y+=s*st;m-=st;}
    if(slide&&Math.abs(dx)<.01)for(let k=1;k<=6;k++){if(!blocked(e,e.x-k,e.y+s)){if(!blocked(e,e.x-1,e.y))e.x-=1;break;}if(!blocked(e,e.x+k,e.y+s)){if(!blocked(e,e.x+1,e.y))e.x+=1;break;}}}}
}

function burst(x,y,n,cols,spd,life,grav,size){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.4+Math.random()*.6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(grav?spd*.5:0),life:life*(.6+Math.random()*.4),max:life,col:cols[i%cols.length],g:grav||0,sz:size||1});}}
function ring(x,y,r,cols){for(let i=0;i<28;i++){const a=i/28*6.283;parts.push({x:x+Math.cos(a)*6,y:y+Math.sin(a)*4,vx:Math.cos(a)*r,vy:Math.sin(a)*r*.6,life:.45,max:.45,col:cols[i%cols.length],g:0,sz:2});}}
function shake(a,t){if(reduceMotion)return;shakeA=a;shakeT=t;}
let toastT=0;

function hint(msg){const el=$('hint');if(!msg){el.hidden=true;return;}el.hidden=false;if(el.textContent!==msg)el.textContent=msg;}

/* ================= dialog ================= */
let dlg=null;
function say(lines,cb){if(!lines||!lines.length){if(cb)cb();return;}dlg={lines,i:0,shown:0,cb};$('dlg').hidden=false;mode='dialog';hint('');showLine();}
function showLine(){const l=dlg.lines[dlg.i];$('dlg-who').textContent=l.who;$('dlg-text').textContent='';$('dlg-more').hidden=true;dlg.shown=0;}
function advance(){if(!dlg)return;const l=dlg.lines[dlg.i];if(dlg.shown<l.text.length){dlg.shown=l.text.length;$('dlg-text').textContent=l.text;$('dlg-more').hidden=false;return;}
  dlg.i++;if(dlg.i>=dlg.lines.length){const cb=dlg.cb;dlg=null;$('dlg').hidden=true;mode='play';for(const k in edge)edge[k]=false;if(cb)cb();return;}showLine();}
function updateDialog(dt){if(!dlg)return;const l=dlg.lines[dlg.i];if(dlg.shown<l.text.length){const before=Math.floor(dlg.shown);dlg.shown=Math.min(l.text.length,dlg.shown+dt*50);const now=Math.floor(dlg.shown);
  if(now!==before){$('dlg-text').textContent=l.text.slice(0,now);if(now%3===0)SFX.blip();}if(dlg.shown>=l.text.length)$('dlg-more').hidden=false;}
  if(edge.sword||edge.roll){edge.sword=edge.roll=false;advance();}}
$('dlg').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();advance();});
function talkTo(n){const dx=P.x-n.x,dy=P.y-n.y;if(Math.abs(dx)>Math.abs(dy)){n.fx=Math.sign(dx);n.fy=0;}else{n.fx=0;n.fy=Math.sign(dy);}n.moving=false;n.walk=0;
  let res=n.talk(n);if(Array.isArray(res))res={lines:res};say(res.lines,res.after);}

  enemies=S.enemies||[];npcs=S.npcs||[];pickups=S.pickups||[];parts=[];lock=null;battleT=0;
  S.hookT=[];for(let i=0;i<map.length;i++)if(map[i]===T.POST||map[i]===T.CRYSTAL)S.hookT.push([i%MW,(i/MW)|0]);$('b-target').classList.remove('lit');S.fight=false;

function drop(x,y,type){const a=Math.random()*6.283;pickups.push({x,y,vx:Math.cos(a)*30,vy:Math.sin(a)*30,z:0,vz:70,type,t:0});}
function cutAt(x,y){const tx=Math.floor(x/TS),ty=Math.floor(y/TS),k=tx+','+ty;if(P.cutSet.has(k))return;P.cutSet.add(k);const t=tileAt(tx,ty);

const HOOK_MAX=152;
function startHook(){let dx=P.fx,dy=P.fy;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  if(lock){const ax=lock.x-P.x,ay=lock.y-P.y,al=Math.hypot(ax,ay)||1;dx=ax/al;dy=ay/al;}
  else{let best=null,bs=1e9;const fa=Math.atan2(dy,dx);
    const consider=(x,y,tol,w)=>{const ax=x-P.x,ay=y-P.y,d=Math.hypot(ax,ay);if(d<8||d>HOOK_MAX+8)return;const ad=angDiff(Math.atan2(ay,ax),fa);if(ad>tol)return;const sc=ad*60+d*.15*w+(w>1?12:0);if(sc<bs){bs=sc;best=[ax/d,ay/d];}};
    for(const[tx,ty]of S.hookT||[])consider(tx*TS+8,ty*TS+8,.5,1);
    for(const e of enemies)if(!e.dead)consider(e.x,e.y,.38,1.2);
    if(best){dx=best[0];dy=best[1];}}

function hookLanding(tx,ty){let best=null,bd=1e9;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;const x=(tx+ox)*TS+8,y=(ty+oy)*TS+8;if(hitsSolid(x,y,P.hw,P.hh))continue;const d=Math.hypot(x-P.x,y-P.y);if(d<bd){bd=d;best=[x,y];}}return best;}
function endHook(){if(P.hk)for(const p of P.hk.carry)p.hooked=false;P.hk=null;P.state='normal';P.hookCd=.15;}
function updateHook(dt){const h=P.hk;if(!h){P.state='normal';return;}
  if(h.ph==='out'){let adv=360*dt;
    while(adv>0&&h.ph==='out'){const st=Math.min(4,adv);adv-=st;h.d+=st;const x=P.x+h.dx*h.d,y=P.y+h.dy*h.d;
      for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-x,(e.y-2)-y)<e.rad+3){hookEnemy(e);h.ph='back';break;}}
      if(h.ph!=='out')break;
      for(const p of pickups)if(!p.hooked&&p.type!=='shard'&&p.type!=='hc'&&Math.hypot(p.x-x,p.y-y)<10){p.hooked=true;h.carry.push(p);}
      const tx=Math.floor(x/TS),ty=Math.floor(y/TS),t=tileAt(tx,ty);

      if(t===T.CRYSTAL){hitCrystal(tx,ty);h.ph='back';break;}
      if(SOLID[t]&&t!==T.PIT){h.ph='back';SFX.clank();burst(x,y-6,4,['#ffffff','#f0c65a'],60,.2);break;}
      if(h.d>=HOOK_MAX){h.ph='back';break;}}}
  else if(h.ph==='back'){h.d-=440*dt;const d=Math.max(0,h.d);for(const p of h.carry){p.x=P.x+h.dx*d;p.y=P.y+h.dy*d;p.vx=p.vy=0;p.z=0;p.vz=0;}if(h.d<=0)endHook();}

function updateTrap(){if(!S.trap||F[S.trap])return;

function updateBeetle(e,dt,dist,dxp,dyp){const boss=e.kind==='grim',p2=boss&&e.ph===1;e.t-=dt;e.cd=Math.max(0,(e.cd||0)-dt);

function step(dt){
  time+=dt;

  if(placeT>0){placeT-=dt;if(placeT<.6)$('place').style.opacity=Math.max(0,placeT/.6);if(placeT<=0)$('place').hidden=true;}
  const portrait=innerHeight>innerWidth*1.05&&matchMedia('(pointer:coarse)').matches;
  if(mode==='title'){cam.x=(Math.sin(time*.06)*.5+.5)*(MW*TS-VW);cam.y=clamp(10*TS-VH/2+Math.sin(time*.04)*40,0,MH*TS-VH);updateParts(dt);}
  else if(mode==='fade'){fade=clamp(fade+fadeDir*dt*4,0,1);
    if(fadeDir>0&&fade>=1&&pendingWarp){const w=pendingWarp;pendingWarp=null;loadScene(w.to,w.tx,w.ty,w.face);saveGame();fadeDir=-1;}
    else if(fadeDir<0&&fade<=0){mode='play';if(S.onEnter)S.onEnter();}}
  else if(mode==='dialog'){battleT=Math.max(0,battleT-dt);updateDialog(dt);updatePip(dt);updateParts(dt);if(P)updateCamera(dt);}
  else if(mode==='play'&&!portrait){
    if(hitstop>0)hitstop-=dt;
    else{playTime+=dt;updatePlayer(dt);
      if(P&&S){const near=enemies.some(e=>!e.dead&&!e.boss&&Math.hypot(e.x-P.x,e.y-P.y)<100)||(S.trap&&S.shut&&!F[S.trap]);battleT=near?3:Math.max(0,battleT-dt);}
      if(mode==='play'){updateEnemies(dt);updateNpcs(dt);updatePickups(dt);updateScene(dt);if(S.id==='forest'&&tut<4)updateTutorial(dt);else if(tut<4){tut=4;hint('');}}}
    updatePip(dt);updateParts(dt);updateCamera(dt);}

function drawDeepMap(g){mapPaper(g);const cw=66,ch=36,gx=16,gy=12,ox=Math.round((MAP_W-(4*cw+3*gx))/2),oy=30;
  mapText(g,'The Hollow Deep',MAP_W/2,17,15);
  const pos=id=>{const[c,r]=HD_ROOMS[id];return[ox+c*(cw+gx),oy+r*(ch+gy)];};
  const vis=id=>!!(F.vis&&F.vis[id]),known=id=>vis(id)||(id==='hd7'&&vis('hd2'));
  /* entrance stub */
  if(vis('hd1')){const[x,y]=pos('hd1');g.fillStyle=INK_L;g.fillRect(x+cw/2-3,y+ch,6,8);mapText(g,'to the quarry',x+cw/2+44,y+ch+6,10,INK_L);}
  for(const[a,b,flag]of HD_LINKS){if(!(vis(a)||vis(b)))continue;const[ax,ay]=pos(a),[bx,by]=pos(b);let x,y,w,h;
    if(ay===by){x=Math.min(ax,bx)+cw;y=ay+ch/2-3;w=gx;h=6;}else{x=ax+cw/2-3;y=Math.min(ay,by)+ch;w=6;h=gy;}

      else{const big=flag==='hd_bl';g.fillStyle='#1b1420';g.fillRect(cx-(big?6:5),cy-(big?6:5),big?12:10,big?12:10);g.fillStyle=big?'#e04a3a':'#f0c65a';g.fillRect(cx-(big?5:4),cy-(big?3:2),big?10:8,big?8:6);g.strokeStyle=big?'#e04a3a':'#f0c65a';g.lineWidth=1.5;g.beginPath();g.arc(cx,cy-(big?3:2),big?3.5:2.5,Math.PI,0);g.stroke();}}}
  for(const id in HD_ROOMS){if(!known(id))continue;const[x,y]=pos(id),here=S&&S.id===id;
    if(vis(id)){g.fillStyle=here?'#f0c65a':'#c4ad80';g.fillRect(x,y,cw,ch);g.strokeStyle=INK;g.lineWidth=2;g.strokeRect(x+1,y+1,cw-2,ch-2);
      if(id==='hd4'||id==='hd5'||id==='hd6'){g.fillStyle='rgba(27,20,32,.55)';if(id==='hd4')g.fillRect(x+cw*.38,y+4,cw*.26,ch-8);else if(id==='hd5')g.fillRect(x+4,y+ch*.58,cw-8,ch*.16);else g.fillRect(x+cw*.2,y+4,cw*.6,ch-8);}

    else{g.strokeStyle=INK_L;g.lineWidth=2;g.setLineDash([4,3]);g.strokeRect(x+1,y+1,cw-2,ch-2);g.setLineDash([]);mapText(g,'?',x+cw/2,y+ch/2-4,16,INK_L);}
    if(id==='hd7'&&!F.hd_done){g.fillStyle='#7a2a1a';g.beginPath();g.ellipse(x+12,y+12,7,5.5,0,0,7);g.fill();g.fillStyle='#ff8a3a';g.fillRect(x+8,y+10,2,2);g.fillRect(x+14,y+10,2,2);}
    if(here&&P)mapYou(g,x+10+clamp(P.x/(MW*TS),0,1)*(cw-20),y+8+clamp(P.y/(MH*TS),0,1)*(ch-22));}
  g.font=mapFont(10);g.textAlign='left';g.textBaseline='middle';const ly=MAP_H-12;
